<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTriet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowTriet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skinTriet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba" />
      <stop offset="100%" stop-color="#f1c27d" />
    </linearGradient>
    <filter id="shadowTriet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle with Mystic Rings -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGradTriet)" stroke="url(#glowTriet)" stroke-width="3" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Mystical Bagua / Constellation Star Accent -->
  <path d="M100 12 L103 24 L115 27 L103 30 L100 42 L97 30 L85 27 L97 24 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="45" cy="45" r="2" fill="#7dd3fc" />
  <circle cx="155" cy="45" r="2.5" fill="#7dd3fc" />
  <circle cx="35" cy="120" r="2" fill="#7dd3fc" />
  <circle cx="165" cy="120" r="2" fill="#7dd3fc" />

  <!-- Body / Robe / Modern Suit -->
  <path d="M40 190 Q100 150 160 190 L160 200 L40 200 Z" fill="#0369a1" />
  <path d="M70 175 L100 145 L130 175 L115 200 L85 200 Z" fill="#0284c7" />
  <path d="M96 150 L100 145 L104 150 L100 195 Z" fill="#e0f2fe" opacity="0.9" />

  <!-- Head & Neck -->
  <rect x="88" y="120" width="24" height="25" rx="8" fill="url(#skinTriet)" />
  <ellipse cx="100" cy="92" rx="36" ry="42" fill="url(#skinTriet)" filter="url(#shadowTriet)" />

  <!-- Stylish Modern Hair -->
  <path d="M62 82 C62 50 80 40 100 40 C125 40 138 52 138 82 C138 86 135 70 125 65 C110 58 85 58 72 68 C66 74 62 82 62 82 Z" fill="#1e293b" />
  <path d="M62 80 C60 95 64 105 66 110 C68 100 69 90 70 82 Z" fill="#1e293b" />
  <path d="M138 80 C140 95 136 105 134 110 C132 100 131 90 130 82 Z" fill="#1e293b" />

  <!-- Eyebrows -->
  <path d="M74 80 Q84 76 92 80" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M108 80 Q116 76 126 80" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Intellectual Glasses -->
  <rect x="72" y="83" width="22" height="15" rx="5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="106" y="83" width="22" height="15" rx="5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M94 90 L106 90" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M65 89 L72 89" stroke="#38bdf8" stroke-width="2" />
  <path d="M128 89 L135 89" stroke="#38bdf8" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="83" cy="90" r="3.5" fill="#0f172a" />
  <circle cx="84.5" cy="88.5" r="1" fill="#ffffff" />
  <circle cx="117" cy="90" r="3.5" fill="#0f172a" />
  <circle cx="118.5" cy="88.5" r="1" fill="#ffffff" />

  <!-- Nose -->
  <path d="M98 94 L100 102 L96 104" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Calm confident smile -->
  <path d="M88 114 Q100 122 112 114" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Headset / Podcast Mic -->
  <path d="M63 92 C58 92 56 100 58 108 C60 114 65 116 68 112 Z" fill="#38bdf8" />
  <path d="M60 108 Q75 130 92 124" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="94" cy="124" r="4.5" fill="#38bdf8" />
</svg>
