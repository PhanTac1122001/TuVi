<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e112a" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="glowMan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="skinMan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <filter id="shadowMan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f472b6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle with Mystic Rings -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGradMan)" stroke="url(#glowMan)" stroke-width="3" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Mystical Star Accent -->
  <path d="M100 12 L103 24 L115 27 L103 30 L100 42 L97 30 L85 27 L97 24 Z" fill="#f472b6" opacity="0.8"/>
  <circle cx="45" cy="45" r="2.5" fill="#fbcfe8" />
  <circle cx="155" cy="45" r="2" fill="#fbcfe8" />
  <circle cx="35" cy="120" r="2" fill="#fbcfe8" />
  <circle cx="165" cy="120" r="2.5" fill="#fbcfe8" />

  <!-- Long Hair Behind -->
  <path d="M55 90 C50 140 60 180 65 195 L135 195 C140 180 150 140 145 90 Z" fill="#3b0764" />

  <!-- Body / Modern Chic Blazer -->
  <path d="M42 192 Q100 155 158 192 L158 200 L42 200 Z" fill="#9d174d" />
  <path d="M72 178 L100 152 L128 178 L112 200 L88 200 Z" fill="#be185d" />
  <path d="M97 154 L100 152 L103 154 L100 195 Z" fill="#fdf2f8" opacity="0.95" />

  <!-- Head & Slender Neck -->
  <rect x="90" y="122" width="20" height="24" rx="8" fill="url(#skinMan)" />
  <ellipse cx="100" cy="94" rx="34" ry="40" fill="url(#skinMan)" filter="url(#shadowMan)" />

  <!-- Elegant Hair Style -->
  <path d="M60 84 C60 48 80 38 100 38 C120 38 140 48 140 84 C140 115 132 125 128 135 C124 105 132 75 125 65 C115 54 85 54 75 65 C68 75 76 105 72 135 C68 125 60 115 60 84 Z" fill="#4c0519" />

  <!-- Eyebrows -->
  <path d="M75 82 Q84 78 92 83" stroke="#500724" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M108 83 Q116 78 125 82" stroke="#500724" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sparkling Animated Eyes -->
  <ellipse cx="84" cy="92" rx="6" ry="4.5" fill="#500724" />
  <circle cx="83" cy="91" r="2" fill="#ffffff" />
  <circle cx="85.5" cy="93.5" r="1" fill="#ffffff" />

  <ellipse cx="116" cy="92" rx="6" ry="4.5" fill="#500724" />
  <circle cx="115" cy="91" r="2" fill="#ffffff" />
  <circle cx="117.5" cy="93.5" r="1" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <circle cx="75" cy="104" r="7" fill="#fb7185" opacity="0.3" filter="blur(2px)" />
  <circle cx="125" cy="104" r="7" fill="#fb7185" opacity="0.3" filter="blur(2px)" />

  <!-- Nose -->
  <path d="M99 96 L100 103 L97 105" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Warm Engaging Lips -->
  <path d="M88 116 Q100 124 112 116 Q100 128 88 116 Z" fill="#e11d48" />

  <!-- Headset / Podcast Mic -->
  <path d="M136 94 C142 94 145 102 143 110 C141 116 136 117 133 113 Z" fill="#f472b6" />
  <path d="M140 110 Q125 132 108 126" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="106" cy="126" r="4.5" fill="#f472b6" />
</svg>
